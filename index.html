<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доходы бюджетов субъектов РФ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin:0; padding:0; height:100%; font-family:'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
  #header { padding:14px 20px 10px; background:#1b2a41; color:#fff; }
  #header h1 { margin:0; font-size:20px; font-weight:600; }
  #header .meta { font-size:12px; opacity:.75; margin-top:3px; }
  #controls { padding:10px 20px; background:#f2f4f8; border-bottom:1px solid #dde3ec; display:flex; flex-wrap:wrap; gap:14px; align-items:center; font-size:14px; }
  #controls label { font-weight:600; margin-right:6px; }
  #controls select { padding:5px 8px; border:1px solid #c3ccd9; border-radius:6px; background:#fff; font-size:14px; max-width:420px; }
  #pcbox { display:flex; align-items:center; gap:6px; }
  #map { height: calc(100vh - 130px); min-height:420px; }
  .legend { background:#fff; padding:10px 12px; border-radius:8px; box-shadow:0 1px 5px rgba(0,0,0,.2); font-size:12px; line-height:20px; }
  .legend .bar { display:flex; gap:2px; margin-bottom:4px; }
  .legend .bar span { width:26px; height:12px; display:inline-block; }
  .legend .labels { display:flex; gap:2px; }
  .legend .labels span { width:26px; text-align:center; transform:translateX(13px); white-space:nowrap; overflow:visible; }
  .legend .title { font-weight:600; margin-bottom:4px; }
  .popup-scroll { max-height:260px; overflow-y:auto; min-width:230px; }
  .popup-scroll table { border-collapse:collapse; width:100%; font-size:12px; }
  .popup-scroll td { padding:2px 4px; border-bottom:1px solid #eee; vertical-align:top; }
  .popup-scroll td.v { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .popup-scroll .pname { font-weight:700; font-size:13px; margin-bottom:4px; }
  #footer { padding:6px 20px 12px; font-size:11.5px; color:#667; background:#f2f4f8; border-top:1px solid #dde3ec; }
  .leaflet-popup-content { margin:10px 12px; }
</style>
</head>
<body>
<div id="header">
  <h1>Доходы бюджетов субъектов Российской Федерации, 2025</h1>
  <div class="meta">Выборка из форм отчётности 0503317, данные на 01.01.2026</div>
</div>
<div id="controls">
  <span><label for="ind">Показатель:</label><select id="ind"></select></span>
  <span id="pcbox"><input type="checkbox" id="percap" checked><label for="percap" style="font-weight:400">на душу населения</label></span>
  <span><label for="fo">Округ:</label><select id="fo"><option value="">Все округа</option></select></span>
</div>
<div id="map"></div>
<div id="footer">Источник: выборка из форм бюджетной отчётности (форма 0503317), данные на 01.01.2026. Население — из геослоя. Регионы без данных показаны серым.</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const PALETTE = ['#ffffd9','#c7e9b4','#7fcdbb','#41b6c4','#1d91c0','#225ea8','#0c2c84'];
const NO_DATA = '#e2e2e2';
const INDICATOR_WHITELIST = null; // null = все показатели из CSV

const map = L.map('map', {zoomControl:true}).setView([62, 90], 3);
map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap, &copy; CARTO', subdomains:'abcd', maxZoom:18
}).addTo(map);

function normKey(s){
  if (s === null || s === undefined) return '';
  s = String(s).toLowerCase().replace(/ё/g,'е').replace(/[—–]/g,'-');
  s = s.replace(/^г\.\s*/,'').replace(/^город\s+/,'').replace(/\s+/g,' ').trim();
  return s;
}
function variants(n){
  const out = new Set([n, n.replace(/\s*-\s*/g,'-'), n.replace(/\s*-\s*/g,' - '), n.replace(/\s*\(.+\)$/,'').trim()]);
  return [...out];
}
function fmt(v, unit){ // v в рублях; unit: 'total' | 'percap'
  if (v === null || v === undefined || !isFinite(v)) return '—';
  if (unit === 'total'){
    const b = v/1e9;
    return b.toLocaleString('ru-RU',{maximumFractionDigits:1}) + ' млрд руб.';
  } else {
    const t = v/1000; // тыс. руб. на человека
    return t.toLocaleString('ru-RU',{maximumFractionDigits:1}) + ' тыс. руб./чел.';
  }
}

let dataByRegion = {}, geoLayer, indicatorList = [], pops = {};

fetch('data.csv').then(r => r.arrayBuffer()).then(buf => {
  const text = new TextDecoder('utf-8').decode(buf);
  const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l => l.trim() !== '');
  const sep = lines[0].includes(';') ? ';' : ',';
  const header = lines[0].split(sep).map(s => s.replace(/^"|"$/g,'').trim());
  indicatorList = header.slice(1);
  for (let i=1; i<lines.length; i++){
    const cells = lines[i].split(sep);
    const name = cells[0].replace(/^"|"$/g,'').trim();
    const rec = {};
    indicatorList.forEach((ind,k) => {
      const raw = (cells[k+1]||'').replace(/\s/g,'').replace(',','.');
      rec[ind] = raw === '' ? null : parseFloat(raw);
    });
    dataByRegion[normKey(name)] = rec;
  }
  return fetch('regions.geojson');
}).then(r => r.json()).then(gj => {
  // округи для фильтра
  const fos = new Set();
  gj.features.forEach(f => { const p=f.properties||{}; if (p.federal_district) fos.add(p.federal_district); });
  [...fos].sort().forEach(fo => {
    const o = document.createElement('option'); o.textContent = fo; o.value = fo;
    document.getElementById('fo').appendChild(o);
  });

  geoLayer = L.geoJSON(gj, {
    style: f => styleFor(f),
    onEachFeature: (f, layer) => {
      const p = f.properties || {};
      const rawName = p.region || p.name || '';
      layer.bindPopup(popupHTML(rawName, p), {maxWidth:320});
      layer.bindTooltip(escapeHtml(rawName), {sticky:true});
      layer.on('mouseover', () => layer.setStyle({weight:2, color:'#333'}));
      layer.on('mouseout',  () => layer.setStyle(styleFor(f)));
    }
  }).addTo(map);

  // проверка сопоставления
  const csvKeys = new Set(Object.keys(dataByRegion));
  const matched = new Set();
  gj.features.forEach(f => {
    const p = f.properties || {};
    const rawName = p.region || p.name || '';
    pops[normKey(rawName)] = p.population || null;
    if (dataByRegion[normKey(rawName)]) matched.add(normKey(rawName));
  });
  const unmatched = [...csvKeys].filter(k => !matched.has(k));
  if (unmatched.length){
    console.warn('Регионы из данных, для которых не нашлась геометрия:', unmatched.map(k => {
      for (const [orig, rec] of Object.entries(dataByRegion)) if (normKey(orig) === k) return orig;
      return k;
    }));
  } else {
    console.log('Все регионы из CSV сопоставлены с геометрией.');
  }

  // список показателей
  const sel = document.getElementById('ind');
  indicatorList.forEach(ind => {
    const o = document.createElement('option'); o.value = ind; o.textContent = ind;
    sel.appendChild(o);
  });
  sel.value = indicatorList.includes('Доходы — итого') ? 'Доходы — итого' : indicatorList[0];

  document.getElementById('ind').addEventListener('change', refresh);
  document.getElementById('percap').addEventListener('change', refresh);
  document.getElementById('fo').addEventListener('change', () => {
    const fo = document.getElementById('fo').value;
    geoLayer.eachLayer(l => {
      const ok = !fo || (l.feature.properties||{}).federal_district === fo;
      if (ok) { if (!map.hasLayer(l)) geoLayer.addLayer(l); }
      else if (map.hasLayer(l)) geoLayer.removeLayer(l);
    });
  });

  refresh();
  try {
    map.fitBounds(L.geoJSON(gj).getBounds(), {padding:[10,10]});
  } catch(e){}
  setTimeout(()=>map.invalidateSize(), 200);
});

function currentMode(){ return document.getElementById('percap').checked ? 'percap' : 'total'; }

function valueFor(props, ind){
  const rec = dataByRegion[normKey(props.region || props.name || '')];
  if (!rec) return null;
  let v = rec[ind];
  if (v === null || v === undefined) return null;
  if (currentMode() === 'percap'){
    const pop = props.population;
    if (!pop || pop <= 0) return null;
    v = v / pop;
  }
  return v;
}

function styleFor(f){
  const ind = document.getElementById('ind').value;
  const v = valueFor(f.properties || {}, ind);
  const color = (v === null) ? NO_DATA : colorFor(v);
  return {fillColor: color, fillOpacity:0.85, color:'#5b6b7c', weight:0.6};
}

let breaks = [], unit = 'total', curMin = 0;
function refresh(){
  const ind = document.getElementById('ind').value;
  unit = currentMode();
  const vals = geoLayer ? geoLayer.getLayers()
      .map(l => valueFor(l.feature.properties || {}, ind))
      .filter(v => v !== null) : [];
  if (vals.length){
    vals.sort((a,b)=>a-b);
    breaks = [];
    for (let q=1; q<PALETTE.length; q++){
      const idx = Math.round((vals.length-1)*q/PALETTE.length);
      breaks.push(vals[idx]);
    }
  } else breaks = [];
  if (geoLayer){
    geoLayer.resetStyle && geoLayer.getLayers().forEach(l => l.setStyle(styleFor(l.feature)));
  }
  updateLegend(ind);
}

function colorFor(v){
  for (let i=0;i<breaks.length;i++) if (v <= breaks[i]) return PALETTE[i];
  return PALETTE[PALETTE.length-1];
}

function updateLegend(ind){
  let el = document.querySelector('.legend');
  if (!el){
    el = L.control({position:'bottomright'});
    el.onAdd = function(){ const d = L.DomUtil.create('div','legend'); return d; };
    el.addTo(map);
    el = document.querySelector('.legend');
  }
  const fmts = v => v===null ? '' : (unit==='total'
    ? (v/1e9).toLocaleString('ru-RU',{maximumFractionDigits:0})
    : (v/1000).toLocaleString('ru-RU',{maximumFractionDigits:1}));
  let html = '<div class="title">' + escapeHtml(ind) + '<br><span style="font-weight:400;font-size:11px">' +
      (unit==='total' ? 'млрд руб.' : 'тыс. руб. на человека') + '</span></div>';
  if (breaks.length === 0){ html += '<div>нет данных</div>'; }
  else {
    let prev = null;
    html += '<div class="bar">' + PALETTE.map(c=>'<span style="background:'+c+'"></span>').join('') + '</div>';
    html += '<div class="labels">' + breaks.map(b=>'<span>'+fmts(b)+'</span>').join('') + '</div>';
  }
  el.innerHTML = html;
}

function popupHTML(rawName, props){
  const rec = dataByRegion[normKey(rawName)];
  let rows = '';
  if (rec){
    rows = indicatorList.map(ind => {
      const v = rec[ind];
      return '<tr><td>' + escapeHtml(ind) + '</td><td class="v">' +
        (v===null?'—':(v/1e9).toLocaleString('ru-RU',{maximumFractionDigits:1})+' млрд') + '</td></tr>';
    }).join('');
    const percap = (props.population && rec['Доходы — итого'])
      ? '<tr><td><b>Доходы — итого, на душу</b></td><td class="v"><b>' + fmt(rec['Доходы — итого']/props.population,'percap') + '</b></td></tr>' : '';
    rows = percap + rows;
  }
  const popLine = props.population
    ? '<div>Население: ' + props.population.toLocaleString('ru-RU') + ' чел.</div>'
    : '';
  return '<div class="popup-scroll"><div class="pname">' + escapeHtml(rawName) + '</div>' + popLine +
    '<table>' + rows + '</table></div>';
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
